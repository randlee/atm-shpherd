[package]
name = "shpherd-tauri"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "shpherd_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
