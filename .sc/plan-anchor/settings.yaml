# .sc/plan-anchor/settings.yaml
# Repository settings for the sc-plan-anchor plugin; commit this file, never put secrets in it.
schema_version: 1
anchor_tracker: bd
# allow_remote_judge: user approved sending Phase B sprint documents and locked
# anchor statements to TypeSafe/Jev on 2026-11-02. This approval is durable for
# plan-anchor judging in this repository; do not ask again while it remains true.
allow_remote_judge: true
# plan_dir: the current phase's plan folder (anchors.json, intent.md, anchor-runs/). Set it again when the phase changes.
plan_dir: "docs/plans/phase-b"
