[atm]
identity = "shp-lead"
default_team = "shpherd"

[rmux]
session = "shpherd"

# Naming rule: dev agents are named for their model's collective noun and carry no
# team prefix; roll agents keep the shp- prefix. (No "lint" names from sc-lint.)
# terra=tribe, luna=litter, astra=army, fable=flock, haiku=hive.

# Window 1: core agents (lead + terra dev + QA)
[[rmux.windows]]
name = "agents"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "shp-lead"
alias = "shp-lead"
model = "sonnet"
env = { ATM_IDENTITY = "shp-lead", ATM_TEAM = "shpherd", CLAUDE_CODE_TASK_LIST_ID = "shpherd" }

[[rmux.windows.panes]]
name = "tribe"
command = "codex --no-daemon -c features.hooks=true --model gpt-6.1-terra --yolo"
env = { ATM_IDENTITY = "tribe", ATM_TEAM = "shpherd", CLAUDE_CODE_TASK_LIST_ID = "shpherd" }

[[rmux.windows.panes]]
name = "shp-quality-mgr"
alias = "shp-quality-mgr"
model = "sonnet"
env = { ATM_IDENTITY = "shp-quality-mgr", ATM_TEAM = "shpherd", CLAUDE_CODE_TASK_LIST_ID = "shpherd" }

# Window 2: specialists (luna + astra codex workers, fable claude)
[[rmux.windows]]
name = "support"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "litter"
command = "codex --no-daemon -c features.hooks=true --model gpt-6.1-luna --yolo"
env = { ATM_IDENTITY = "litter", ATM_TEAM = "shpherd", CLAUDE_CODE_TASK_LIST_ID = "shpherd" }

[[rmux.windows.panes]]
name = "army"
command = "codex --no-daemon -c features.hooks=true --model gpt-6-astra --yolo"
env = { ATM_IDENTITY = "army", ATM_TEAM = "shpherd", CLAUDE_CODE_TASK_LIST_ID = "shpherd" }

[[rmux.windows.panes]]
name = "flock"
model = "fable"
env = { ATM_IDENTITY = "flock", ATM_TEAM = "shpherd", CLAUDE_CODE_TASK_LIST_ID = "shpherd" }

# Window 3: publishing + sanity + haiku dev
[[rmux.windows]]
name = "publishing"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "shp-publisher"
alias = "shp-publisher"
model = "sonnet"
env = { ATM_IDENTITY = "shp-publisher", ATM_TEAM = "shpherd", CLAUDE_CODE_TASK_LIST_ID = "shpherd" }

[[rmux.windows.panes]]
name = "shp-sanity"
alias = "shp-sanity"
model = "sonnet"
env = { ATM_IDENTITY = "shp-sanity", ATM_TEAM = "shpherd", CLAUDE_CODE_TASK_LIST_ID = "shpherd" }

[[rmux.windows.panes]]
name = "hive"
model = "haiku"
env = { ATM_IDENTITY = "hive", ATM_TEAM = "shpherd", CLAUDE_CODE_TASK_LIST_ID = "shpherd" }
